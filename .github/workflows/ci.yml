name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Test safety checks
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build native application
        run: ./scripts/build.sh
